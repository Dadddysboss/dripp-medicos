<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Dripp Medicos — Gynecological Pharmacy POS</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <link rel="manifest" href="/manifest.json">
  <meta name="description" content="Hospital-based Gynecological, Obstetrics and Women's Health Pharmacy POS System." />
  <meta name="theme-color" content="#0d9488">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">

  <!-- Tailwind CDN for development (production should use PostCSS build) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      suppressWarnings: true,
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#fdf2f8',
              100: '#fce7f3',
              200: '#fbcfe8',
              300: '#f9a8d4',
              400: '#f472b6',
              500: '#ec4899',
              600: '#db2777',
              700: '#be185d',
              800: '#9d174d',
              900: '#831843',
            },
            ink: {
              50:  '#f8fafc',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          boxShadow: {
            'glow': '0 0 24px -4px rgba(236, 72, 153, 0.45)',
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    html, body { font-family: 'Inter', sans-serif; }
    body { -webkit-font-smoothing: antialiased; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

    .dark ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); }

    /* View transitions */
    .view { animation: fadeUp 0.25s ease-out; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Sync pulse */
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }
    .sync-dot { animation: pulseDot 1.4s ease-in-out infinite; }

    /* Toast */
    #toast-container { pointer-events: none; }
    .toast { pointer-events: auto; }

    /* Mobile bottom nav */
    .mobile-nav-item { color: #94a3b8; }
    .mobile-nav-item.active,
    .mobile-nav-item:focus { color: #ec4899; }
    .dark .mobile-nav-item { color: #64748b; }
    .dark .mobile-nav-item.active,
    .dark .mobile-nav-item:focus { color: #f472b6; }

    /* POS mobile cart drawer */
    .cart-drawer { 
      transform: translateY(100%); 
      transition: transform 0.3s ease-out; 
    }
    .cart-drawer.open { 
      transform: translateY(0); 
    }
    .cart-drawer-backdrop {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
    }
    .cart-drawer-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    /* Inventory table scroll */
    .inventory-table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Cart toggle button */
    .cart-toggle-btn {
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    /* Hide default number input arrows */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    /* Print styles for receipt */
    @media print {
      body * { visibility: hidden; }
      #receipt-print, #receipt-print * { visibility: visible; }
      #receipt-print { position: absolute; left: 0; top: 0; width: 100%; }
    }

    /* Responsive grid utilities */
    .stats-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }

    .image-library-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    @media (min-width: 640px) { .image-library-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .image-library-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1024px) { .image-library-grid { grid-template-columns: repeat(5, 1fr); } }
    @media (min-width: 1280px) { .image-library-grid { grid-template-columns: repeat(6, 1fr); } }

    /* POS responsive grid */
    .pos-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 1024px) { .pos-grid { grid-template-columns: 3fr 2fr; } }

    /* Modal responsive */
    .modal-responsive { max-width: 100%; margin: 0.5rem; }
    @media (min-width: 640px) { .modal-responsive { max-width: 28rem; margin: auto; } }
    @media (min-width: 768px) { .modal-responsive { max-width: 32rem; } }
    @media (min-width: 1024px) { .modal-responsive { max-width: 48rem; } }

    /* Touch targets */
    @media (max-width: 768px) {
      .touch-target { min-height: 44px; min-width: 44px; }
      button, a, input, select { font-size: 16px; /* Prevent zoom on iOS */ }
    }

    /* Safe area insets for notched devices */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 1rem); }
    .safe-top { padding-top: env(safe-area-inset-top, 0); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-ink-900 text-slate-800 dark:text-slate-100 min-h-screen">

  <!-- App Shell -->
  <div id="app" class="flex min-h-screen">

    <!-- =================== SIDEBAR =================== -->
    <aside id="sidebar"
           class="fixed lg:static z-40 inset-y-0 left-0 w-64 transform -translate-x-full lg:translate-x-0
                  bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800
                  transition-transform duration-200 ease-out flex flex-col">

      <!-- Brand -->
      <div class="px-5 py-5 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-glow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-white">
            <path d="M9.5 13.5 8 22l3-3 3 3-1.5-8.5"/>
            <path d="M12 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
            <path d="M5.5 13a6.5 6.5 0 0 1 13 0v3a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2Z"/>
          </svg>
        </div>
        <div class="leading-tight">
          <div class="font-bold text-base tracking-tight">Dripp Medicos</div>
          <div class="text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400">Gyno · Obs · Women</div>
        </div>
      </div>

      <!-- Nav -->
      <nav id="nav-links" class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
        <a href="#dashboard" data-nav="dashboard" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="#pos" data-nav="pos" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.5 2.5 0 0 0-5 0v1H8v4h8v-4h-1.5z"/></svg>
          <span>Cash Counter</span>
        </a>
        <a href="#inventory" data-nav="inventory" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h18"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="12" r="1.5" fill="currentColor"/><circle cx="7" cy="17" r="1.5" fill="currentColor"/></svg>
          <span>Inventory</span>
        </a>
        <a href="#sales" data-nav="sales" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-5"/></svg>
          <span>Sales & Reports</span>
        </a>
        <a href="#settings" data-nav="settings" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span>System Settings</span>
        </a>
      </nav>

      <!-- Sidebar footer -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-800">
        <button id="sidebar-toggle-mobile" class="lg:hidden w-full text-xs px-3 py-2 rounded-md bg-slate-100 dark:bg-slate-800">Close menu</button>
        <div class="hidden lg:block text-[11px] text-slate-500 dark:text-slate-400 px-2 py-2">
          v1.0.0 · © Dripp Medicos
        </div>
      </div>
    </aside>

<!-- Sidebar overlay (mobile) -->
      <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>

      <!-- Mobile bottom navigation (visible only on mobile) -->
      <nav id="mobile-bottom-nav" class="fixed bottom-0 left-0 right-0 z-40 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 lg:hidden">
        <div class="grid grid-cols-5 gap-0">
          <a href="#dashboard" data-nav="dashboard" class="mobile-nav-item flex flex-col items-center gap-1 py-2 px-2 text-xs font-medium transition">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
            <span>Dashboard</span>
          </a>
          <a href="#pos" data-nav="pos" class="mobile-nav-item flex flex-col items-center gap-1 py-2 px-2 text-xs font-medium transition">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.5 2.5 0 0 0-5 0v1H8v4h8v-4h-1.5z"/></svg>
            <span>POS</span>
          </a>
          <a href="#inventory" data-nav="inventory" class="mobile-nav-item flex flex-col items-center gap-1 py-2 px-2 text-xs font-medium transition">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h18"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="12" r="1.5" fill="currentColor"/><circle cx="7" cy="17" r="1.5" fill="currentColor"/></svg>
            <span>Inventory</span>
          </a>
          <a href="#sales" data-nav="sales" class="mobile-nav-item flex flex-col items-center gap-1 py-2 px-2 text-xs font-medium transition">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-5"/></svg>
            <span>Sales</span>
          </a>
          <a href="#settings" data-nav="settings" class="mobile-nav-item flex flex-col items-center gap-1 py-2 px-2 text-xs font-medium transition">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
            <span>Settings</span>
          </a>
        </div>
      </nav>

      <!-- =================== MAIN =================== -->
      <div class="flex-1 flex flex-col min-w-0 pb-16 lg:pb-0">

      <!-- ====== HEADER ====== -->
      <header class="sticky top-0 z-20 backdrop-blur bg-white/80 dark:bg-ink-900/80 border-b border-slate-200 dark:border-slate-800">
        <div class="flex items-center gap-3 px-4 sm:px-6 py-3">

          <!-- Mobile sidebar toggle -->
          <button id="sidebar-open" class="lg:hidden p-2 -ml-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>

          <!-- Page title -->
          <div class="min-w-0">
            <div id="page-title" class="text-sm sm:text-base font-semibold truncate">Dashboard</div>
            <div id="page-subtitle" class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 truncate">Overview & analytics</div>
          </div>

          <div class="flex-1"></div>

          <!-- Live time -->
          <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800/60 text-xs font-mono">
            <svg class="w-4 h-4 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="live-time">--:--:--</span>
          </div>

          <!-- Sync status badge -->
          <div id="sync-badge"
               class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800/60 text-xs font-medium"
               title="Sync status">
            <span id="sync-dot" class="sync-dot inline-block w-2 h-2 rounded-full bg-slate-400"></span>
            <span id="sync-label">Idle</span>
          </div>

          <!-- Current user (cashier) -->
          <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800/60 text-xs">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center text-white font-bold">
              <span id="cashier-initial">C</span>
            </div>
            <div class="leading-tight">
              <div class="text-[10px] uppercase tracking-wider text-slate-500 dark:text-slate-400">Cashier</div>
              <div id="cashier-name" class="font-semibold">Cashier</div>
            </div>
          </div>

          <!-- Quick settings toggle -->
          <button id="quick-settings-toggle" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" title="Quick settings">

          </button>

          <!-- Theme toggle -->
          <button id="theme-toggle" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" title="Toggle theme">
            <svg id="icon-sun" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg id="icon-moon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
          </button>
        </div>
      </header>

      <!-- Loading Screen (shown before app.js initializes) -->
      <div id="loading-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-white dark:bg-ink-900 transition-opacity duration-300">
        <div class="text-center">
          <svg class="w-16 h-16 mx-auto mb-4 text-brand-500 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
          </svg>
          <p class="text-slate-500 dark:text-slate-400 text-sm">Loading Dripp Medicos…</p>

      </div>

      <!-- ====== VIEW CONTAINER ====== -->
      <main id="view-container" class="flex-1 p-4 sm:p-6 overflow-y-auto min-h-screen">
    </div>
  </div>

  <!-- =================== MODAL ROOT =================== -->
  <div id="modal-root"></div>

  <!-- =================== TOAST CONTAINER =================== -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

  <!-- =================== RECEIPT PRINT (hidden) =================== -->
  <div id="receipt-print" class="hidden"></div>

  <!-- =================== SCRIPTS =================== -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script type="module" src="js/app.js?v=1.0.1"></script>
</body>
</html>
